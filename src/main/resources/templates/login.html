<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ShopSphere</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div id="toast" class="toast"></div>

<nav class="navbar">
    <div class="nav-logo">
        <h2>ShopSphere</h2>
    </div>
    <div class="nav-links">
        <a href="/">Home</a>
    </div>
</nav>

<main class="form-card" style="margin: 80px auto; max-width: 400px; padding: 30px; background: white; border-radius: 8px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);">
    <h2 style="margin-bottom: 20px; color: #0f172a;">Login</h2>

    <form id="loginForm">
        <input type="email"
               id="email"
               placeholder="Enter Email"
               required
               style="width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box;">

        <input type="password"
               id="password"
               placeholder="Enter Password"
               required
               style="width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box;">

        <p id="errorText"
           style="color: red; margin-bottom: 15px; font-size: 14px;">
        </p>

        <div class="auth-buttons">

            <button type="submit">
                Login
            </button>

            <a href="/register-page">
                Register
            </a>

        </div>

        <p style="margin-top: 18px; text-align: center; color: #64748b; font-size: 14px;">
            New user? Register to continue shopping.
        </p>
    </form>
</main>

<script src="/js/login.js"></script>
</body>
</html>
