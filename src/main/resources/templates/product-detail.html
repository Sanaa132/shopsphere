<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Product Detail - ShopSphere</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<!-- ================= NAVBAR ================= -->
<div class="navbar">
    <h2>ShopSphere</h2>

    <div class="nav-links">
        <a href="/">Home</a>
        <a href="/wishlist-page">Wishlist</a>
        <a href="/orders-page">Orders</a>
        <a href="/cart-page">Cart</a>
    </div>
</div>

<!-- ================= PRODUCT DETAIL ================= -->
<div class="container">

    <div class="product-detail-grid">

        <!-- LEFT IMAGE -->
        <div class="product-image-section">
            <img id="productImage" src="" alt="Product Image">
        </div>

        <!-- RIGHT DETAILS -->
        <div class="product-info-section">

            <h1 id="productName"></h1>

            <p id="categoryName" style="color:#94a3b8;"></p>

            <div style="margin:15px 0;">
                <span id="discountPrice"
                      style="font-size:28px; color:#fbbf24; font-weight:bold;"></span>

                <span id="originalPrice"
                      style="text-decoration:line-through; margin-left:10px; color:#94a3b8;"></span>
            </div>

            <p id="description" style="margin:15px 0;"></p>

            <p id="stockInfo" style="font-weight:bold;"></p>

            <!-- BUTTONS -->
            <button id="addToCartBtn" class="btn-primary" style="margin-top:20px;">
                Add to Cart
            </button>

            <button id="addToWishlistBtn" class="btn-secondary" style="margin-top:10px;">
                Add to Wishlist
            </button>

        </div>
    </div>

</div>

<!-- TOAST -->
<div id="toast" class="toast"></div>

<script src="/js/product-detail.js"></script>

</body>
</html>
